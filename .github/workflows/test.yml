name: Test

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  unit:
    name: Terraform unit tests (mocked providers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Init
        run: terraform init -backend=false

      - name: Unit tests
        run: terraform test -filter=tests/unit_root.tftest.hcl -filter=tests/unit_plan.tftest.hcl -filter=tests/unit_report.tftest.hcl -filter=tests/unit_restore_testing.tftest.hcl -filter=tests/unit_framework.tftest.hcl
